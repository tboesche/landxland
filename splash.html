// ── Helpers ───────────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function easeCustom(t,inPow,outPow){if(t<=0)return 0;if(t>=1)return 1;return t<0.5?Math.pow(2*t,inPow)/2:1-Math.pow(2*(1-t),outPow)/2;}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function setShadow(el,height){
  const sz=P.shadowSize,h=Math.max(0,height);
  if(!sz||h<0.01){el.style.filter='';return;}
  const blur=h*sz,dx=h*sz*0.5,dy=h*sz*0.85,alpha=Math.min(0.5,h*0.22);
  // NOTE the two closing parens: one for rgba(, one for drop-shadow(.  This was
  // short by one, which makes the whole filter value invalid CSS.  Nothing
  // throws — the browser just drops the declaration — so the entire 3-D lift
  // effect was silently inert in every baked splash while the dev harness in
  // splash_animation.html (which has it right) looked correct.
  el.style.filter='drop-shadow('+dx.toFixed(1)+'px '+dy.toFixed(1)+'px '+blur.toFixed(1)+'px rgba(0,0,0,'+alpha.toFixed(2)+'))';
}

function animProp(el,prop,from,to,dur,ease=easeInOutCubic){
  return new Promise(res=>{
    const t0=performance.now();
    function step(now){
      const t=ease(Math.min((now-t0)/dur,1));
      el.style[prop]=from+(to-from)*t;
      t<1?requestAnimationFrame(step):res();
    }
    requestAnimationFrame(step);
  });
}

function segsToD(segs){
  return segs.map(pts=>'M'+pts.map(p=>p[0]+','+p[1]).join('L')+'Z').join(' ');
}

// ── Build DOM from baked data ─────────────────────────────────────────────────
const svg1=document.getElementById('svg1');
const svg2=document.getElementById('svg2');
const fillsG=svg1.getElementById('s1-fills');
const outlinesG=svg1.getElementById('s1-outlines');
const fills2G=svg2.getElementById('s2-fills');

OUTLINES.forEach(o=>{
  const p=document.createElementNS(SVG_NS,'path');
  p.id=o.id;
  p.setAttribute('d',o.d);
  p.setAttribute('fill','none');
  p.setAttribute('stroke',o.stroke);
  p.setAttribute('stroke-width',o.strokeWidth);
  outlinesG.appendChild(p);
});

STATES.forEach(s=>{
  const p1=document.createElementNS(SVG_NS,'path');
  p1.id='anim-'+s.id;
  p1.setAttribute('d',segsToD(s.srcSegs));
  p1.setAttribute('fill',s.fill);
  p1.setAttribute('stroke','none');
  p1.setAttribute('fill-opacity','0');
  fillsG.appendChild(p1);

  const p2=document.createElementNS(SVG_NS,'path');
  p2.id='anim2-'+s.id;
  p2.setAttribute('d',s.tgtPoly);
  p2.setAttribute('fill',s.fill);
  p2.setAttribute('stroke','none');
  fills2G.appendChild(p2);
});

// ── Animation engine ──────────────────────────────────────────────────────────
async function runAnimation(){
  const f1=STATES.map(s=>document.getElementById('anim-'+s.id));
  const f2=STATES.map(s=>document.getElementById('anim2-'+s.id));
  const ol=[...outlinesG.querySelectorAll('path')];

  // KF1: outlines visible, fills hidden
  ol.forEach(el=>el.setAttribute('stroke-opacity','1'));
  await sleep(500);

  // KF1→KF3: fills pop from centroid, outlines dissolve simultaneously
  {
    const dur=P.dur1*1000,st=P.stagger;
    ol.forEach(el=>{
      el.style.transition='stroke-opacity '+(P.dur1*0.85)+'s ease-in';
      el.setAttribute('stroke-opacity','0');
    });
    await Promise.all(f1.map((el,i)=>{
      const [cx,cy]=STATES[i].srcCentroid;
      return sleep(i*st).then(()=>new Promise(res=>{
        el.setAttribute('fill-opacity','1');
        el.setAttribute('transform','translate('+cx+','+cy+') scale(0) translate('+(-cx)+','+(-cy)+')');
        const d=Math.max(dur-i*st,300),t0=performance.now();
        function step(now){
          const raw=Math.min((now-t0)/d,1),sc=easeOutBack(raw);
          setShadow(el,sc);
          if(raw>=1){el.removeAttribute('transform');setShadow(el,1);res();}
          else{el.setAttribute('transform','translate('+cx+','+cy+') scale('+sc+') translate('+(-cx)+','+(-cy)+')');requestAnimationFrame(step);}
        }
        requestAnimationFrame(step);
      }));
    }));
  }
  await sleep(P.hold*1000);

  // KF3→KF4: polygon morph
  {
    const dur=P.dur3*1000,st=P.stagger;
    await Promise.all(STATES.map((s,i)=>sleep(i*st).then(()=>{
      const el=f1[i];
      if(!s.srcSegs||!s.srcSegs.length)return;
      const N=s.srcSegs[0].length;
      const tgtFull=s.srcSegs.map((_,si)=>
        s.tgtSegs&&s.tgtSegs[si]?s.tgtSegs[si]:new Array(N).fill(s.tgtCentroid));
      const t0=performance.now();
      return new Promise(res=>{
        function step(now){
          const raw=Math.min((now-t0)/dur,1),te=easeCustom(raw,P.easeIn3,P.easeOut3);
          el.setAttribute('d',segsToD(s.srcSegs.map((src,si)=>{
            const tgt=tgtFull[si];
            return src.map((sp,j)=>[sp[0]+(tgt[j][0]-sp[0])*te,sp[1]+(tgt[j][1]-sp[1])*te]);
          })));
          raw<1?requestAnimationFrame(step):res();
        }
        requestAnimationFrame(step);
      });
    })));
    // Instant swap to SVG2 (shapes are now identical)
    f1.forEach(el=>{el.style.filter='';});
    svg1.style.opacity='0';
    svg2.style.opacity='1';
    // Prime resting shadows on SVG2 shapes before the translate animation
    f2.forEach(el=>setShadow(el,1));
  }
  // await sleep(P.hold*1000);

  // KF4→KF5: matrix transforms with wobble
  {
    const dur=P.dur4*1000;
    await Promise.all(STATES.map((s,i)=>new Promise(async res=>{
      await sleep(i*P.stagger);
      const el=f2[i];
      if(!s.transform2){res();return;}
      const m=s.transform2.match(/matrix\(([^)]+)\)/);
      if(!m){el.setAttribute('transform',s.transform2);res();return;}
      const [a,,,d,e,f]=m[1].split(',').map(Number);
      const wx=(Math.random()-.5)*P.wobble*20,wy=(Math.random()-.5)*P.wobble*20;
      const animDur=Math.max(dur-i*P.stagger,300),t0=performance.now();
      function step(now){
        const t=Math.min((now-t0)/animDur,1),tc=easeCustom(t,P.easeIn4,P.easeOut4);
        el.setAttribute('transform',
          'matrix('+(1+(a-1)*tc)+',0,0,'+(1+(d-1)*tc)+','+(e*tc+wx*Math.sin(t*Math.PI))+','+(f*tc+wy*Math.sin(t*Math.PI))+')');
        setShadow(el,1+Math.sin(t*Math.PI)*P.shadowDepth);
        if(t<1)requestAnimationFrame(step);
        else{el.setAttribute('transform',s.transform2);setShadow(el,1);res();}
      }
      requestAnimationFrame(step);
    })));
  }

  // ── Hold, then exit ───────────────────────────────────────────────────────
  // Was an unconditional sleep(500).  Now the minimum beat still applies — the
  // final frame should be seen — but if the app is still loading, the splash
  // waits on __splashGate rather than exiting onto an empty page.
  await sleep(500);
  await _gate();
  // Fire splashDone immediately so the parent can start fading in its content
  // while the exit animation is still playing.
  document.dispatchEvent(new CustomEvent('splashDone'));
  _tell('splashDone');
  // App content is now visible behind — clear the stage background immediately
  document.getElementById('stage').style.background='transparent';
  if(P.exitFly && !_skip){
    const exitMs=P.exitDur*1000, st=Math.max(P.stagger*0.5,10);
    // Convert screen-space fly distances to SVG2 user space via CTM, then
    // accumulate directly into the matrix(a,0,0,d,e,f) transform attribute.
    // t=0 produces exactly the KF5 transform (dx=dy=0), so there is no snap.
    const ctm=svg2.getScreenCTM();
    const svgSX=ctm.a, svgSY=ctm.d;
    const offDist=Math.sqrt(window.innerWidth**2+window.innerHeight**2);
    // Pre-parse KF5 matrix values; default to identity for untransformed states.
    const kf5=STATES.map(s=>{
      let a=1,d=1,e=0,fv=0;
      if(s.transform2){const m=s.transform2.match(/matrix\(([^)]+)\)/);if(m){[a,,,d,e,fv]=m[1].split(',').map(Number);}}
      return{a,d,e,f:fv};
    });
    await Promise.all(f2.map((el,i)=>new Promise(res=>{
      setTimeout(()=>{
        const{a,d,e,f}=kf5[i];
        const angle=Math.random()*2*Math.PI;
        const flyX=Math.cos(angle)*offDist/svgSX;
        const flyY=Math.sin(angle)*offDist/svgSY;
        const wx=(Math.random()-.5)*P.wobble*20/svgSX;
        const wy=(Math.random()-.5)*P.wobble*20/svgSY;
        const t0=performance.now();
        function step(now){
          const t=Math.min((now-t0)/exitMs,1),te=easeInOutCubic(t);
          const dx=flyX*te+wx*Math.sin(t*Math.PI);
          const dy=flyY*te+wy*Math.sin(t*Math.PI);
          const sc=1+t*0.35;
          setShadow(el, (1+Math.sin(t*Math.PI*0.75)*P.shadowDepth)*(1-t*0.7));
          el.setAttribute('transform','matrix('+(a*sc)+',0,0,'+(d*sc)+','+(e+dx).toFixed(1)+','+(f+dy).toFixed(1)+')');

          setShadow(el,(1+Math.sin(t*Math.PI*0.75)*P.shadowDepth)*(1-t*0.7));
          if(t<1)requestAnimationFrame(step);
          else res();
        }
        requestAnimationFrame(step);
      },i*st);
    })));
  } else {
    // A skipped splash gets out of the way at once rather than sitting through
    // the fallback second.
    await sleep(_skip ? 0 : 1000);
  }
  
  document.getElementById('stage').style.display='none';
  document.dispatchEvent(new CustomEvent('splashGone'));
  _tell('splashGone');
}

document.addEventListener('DOMContentLoaded', runAnimation);
</script>
</body>
</html>
